<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f4;--card:#fff;--ink:#16231d;--mute:#5f6f67;--line:#d5ded9;--acc:#0f7a4d;--accink:#fff;--out:#e4f2ea;--neg:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18231d;--ink:#e8f1ec;--mute:#93a69b;--line:#2b3b32;--acc:#3fc489;--accink:#07200f;--out:#1e3329;--neg:#ff7b7b}}
:root[data-theme="dark"]{--bg:#101814;--card:#18231d;--ink:#e8f1ec;--mute:#93a69b;--line:#2b3b32;--acc:#3fc489;--accink:#07200f;--out:#1e3329;--neg:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brand img{width:64px;height:auto;flex:none}
h1{font-size:1.35rem;margin:0}
.brand p{margin:0;color:var(--mute);font-size:.88rem}
h2{font-size:1.05rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.88rem;color:var(--mute);margin:12px 0 4px}
label:first-of-type{margin-top:0}
input{width:100%;font:inherit;font-size:1.1rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{width:100%;margin-top:16px;font:inherit;font-size:1.1rem;font-weight:600;padding:13px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);cursor:pointer}
.err{color:var(--neg);font-size:.9rem;margin-top:10px;display:none}
.banner{background:var(--acc);color:var(--accink);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.res{background:var(--out);border:1px solid transparent;border-radius:14px;padding:16px}
.res.best{border-color:var(--acc)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tag{background:var(--acc);color:var(--accink);font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px}
.rate{color:var(--mute);font-size:.85rem;margin:0 0 6px}
.sec{font-size:.85rem;color:var(--mute);margin:10px 0 0;border-top:1px dashed var(--line);padding-top:8px}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.line span:first-child{color:var(--mute)}
.line b{font-variant-numeric:tabular-nums;text-align:right}
.big{font-size:1.15rem;padding-top:8px}
.big span:first-child{color:var(--ink);font-weight:600}
.big b{color:var(--acc)}
.pos{color:var(--acc)!important}.neg{color:var(--neg)!important}
.note{font-size:.78rem;color:var(--mute);margin:8px 0 0}
</style>
</head>

<div class="card">
<label for="qty">จำนวนหุ้น</label>
<input id="qty" type="number" inputmode="numeric" placeholder="เช่น 1000" min="0">
<div class="row">
<div><label for="bp">ราคาซื้อ (บาท)</label><input id="bp" type="number" inputmode="decimal" placeholder="เช่น 25.50" min="0" step="any"></div>
<div><label for="sp">ราคาขาย (ไม่ใส่ก็ได้)</label><input id="sp" type="number" inputmode="decimal" placeholder="เช่น 27.00" min="0" step="any"></div>
</div>
<label for="sq">จำนวนหุ้นที่ขาย (ว่าง = เท่ากับที่ซื้อ)</label>
<input id="sq" type="number" inputmode="numeric" placeholder="เท่ากับจำนวนซื้อ" min="0">
<button id="go" type="button">คำนวณ</button>
<div class="err" id="err"></div>
</div>

<div id="out" hidden>
<div class="grid" id="cards"></div>
</div>
<p class="note">ผลคำนวณเป็นการประมาณการเท่านั้น อัตราจริงขึ้นอยู่กับโบรกเกอร์</p>
</main>
<script>
(function(){
var PLANS=[{key:"N",rate:0.16799}];
var $=function(i){return document.getElementById(i)};
var f=function(n,d){return n.toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d})};
function calc(R,q,bp,sp,sq){
 var bv=q*bp,bc=bv*R/100,bt=bv+bc,r={bv:bv,bc:bc,bt:bt,unit:bt/q,fee:bc};
 if(sp>0){var sv=sq*sp,sc=sv*R/100,sn=sv-sc,cost=bt/q*sq,pl=sn-cost;
  r.s={sv:sv,sc:sc,sn:sn,pl:pl,pc:pl/cost*100};r.fee+=sc}
 return r}
function card(p,r,best){
 var h='<div class="res'+(best?' best':'')+'"><div class="head"><h2>ผลคำนวณ</h2>'+(best?'<span class="tag">ถูกกว่า</span>':'')+'</div>'
 +'<p class="rate">ค่าคอม '+p.rate+'%</p>'
 +'<div class="line"><span>มูลค่าหุ้น</span><b>'+f(r.bv,2)+'</b></div>'
 +'<div class="line"><span>ค่าคอมซื้อ</span><b>'+f(r.bc,2)+'</b></div>'
 +'<div class="line"><span>ต้นทุนต่อหุ้น</span><b>'+f(r.unit,4)+'</b></div>'
 +'<div class="line big"><span>ยอดซื้อทั้งหมด</span><b>'+f(r.bt,2)+'</b></div>';
 if(r.s){var c=r.s.pl>0?'pos':r.s.pl<0?'neg':'',sg=r.s.pl>0?'+':'';
  h+='<p class="sec">ยอดขาย</p>'
  +'<div class="line"><span>มูลค่าหุ้น</span><b>'+f(r.s.sv,2)+'</b></div>'
  +'<div class="line"><span>ค่าคอมขาย</span><b>'+f(r.s.sc,2)+'</b></div>'
  +'<div class="line"><span>ยอดขายสุทธิ</span><b>'+f(r.s.sn,2)+'</b></div>'
  +'<div class="line big"><span>กำไร/ขาดทุน</span><b class="'+c+'">'+sg+f(r.s.pl,2)+' ('+sg+f(r.s.pc,2)+'%)</b></div>'}
 return h+'</div>'}
function go(){
 var q=parseFloat($("qty").value),bp=parseFloat($("bp").value),sp=parseFloat($("sp").value)||0;
 var sq=parseFloat($("sq").value)||q,e=$("err");
 var msg=!(q>0)||!(bp>0)?"กรุณาใส่จำนวนหุ้นและราคาซื้อให้ถูกต้อง":(sp>0&&sq>q)?"จำนวนที่ขายมากกว่าที่ซื้อ":"";
 if(msg){e.textContent=msg;e.style.display="block";$("out").hidden=true;return}
 e.style.display="none";
 var rs=PLANS.map(function(p){return calc(p.rate,q,bp,sp,sq)});
 $("cards").innerHTML=PLANS.map(function(p,i){return card(p,rs[i],false)}).join("");
 $("out").hidden=false;
 $("out").scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("go").addEventListener("click",go);
["qty","bp","sp","sq"].forEach(function(i){$(i).addEventListener("keydown",function(e){if(e.key==="Enter")go()})});
})();
</script>
